<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>导航栏</title>
    <style>
      :root {
        --h: 44px;
        --bg: #2b2d31;
        --bg2: #1e2024;
        --fg: #e6e8eb;
        --dim: #8b9099;
        --line: #3a3d43;
        --accent: #4a9eff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: var(--h);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--fg);
        user-select: none;
        overflow: hidden;
      }
      button {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.12s;
      }
      button:hover:not(:disabled) {
        background: #3a3d43;
      }
      button:active:not(:disabled) {
        background: #45484f;
      }
      button:disabled {
        color: #55585f;
        cursor: default;
      }
      #url {
        flex: 1 1 auto;
        min-width: 0;
        height: 30px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 15px;
        background: var(--bg2);
        color: var(--fg);
        font-size: 12.5px;
        outline: none;
      }
      #url:focus {
        border-color: var(--accent);
        background: #16181c;
      }
      #badge {
        flex: 0 0 auto;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 4px 10px;
        border-radius: 11px;
        background: #343841;
        color: var(--dim);
        font-size: 11.5px;
      }
      #badge b {
        color: var(--fg);
        font-weight: 600;
      }
      .spin {
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <button id="back" title="后退">‹</button>
    <button id="fwd" title="前进">›</button>
    <button id="reload" title="刷新">⟳</button>
    <button id="home" title="主页">⌂</button>
    <input id="url" spellcheck="false" placeholder="输入网址或搜索内容" />
    <span id="badge"></span>

    <script>
      const $ = (id) => document.getElementById(id)
      const nav = window.chromeApi

      let editing = false
      $('url').addEventListener('focus', () => {
        editing = true
        $('url').select()
      })
      $('url').addEventListener('blur', () => {
        editing = false
      })

      $('back').onclick = () => nav.back()
      $('fwd').onclick = () => nav.forward()
      $('home').onclick = () => nav.home()
      $('reload').onclick = () => nav.reload()

      $('url').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          nav.navigate($('url').value.trim())
          $('url').blur()
        } else if (e.key === 'Escape') {
          $('url').blur()
          nav.refresh()
        }
      })

      // 主进程推送当前状态；地址栏正在编辑时不覆盖用户输入
      nav.onState((s) => {
        if (!editing) $('url').value = s.url ?? ''
        $('back').disabled = !s.canGoBack
        $('fwd').disabled = !s.canGoForward
        $('reload').textContent = s.loading ? '✕' : '⟳'
        $('reload').title = s.loading ? '停止' : '刷新'
        $('reload').classList.toggle('spin', false)
        $('badge').innerHTML = s.identityName ? `<b>${s.identityName}</b>` : ''
        $('badge').title = s.partition ?? ''
      })

      nav.ready()
    </script>
  </body>
</html>
