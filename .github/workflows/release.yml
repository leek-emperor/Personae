name: Build & Release

# 只手动触发。
#
# 刻意不加 push / tag / schedule 触发器：这个项目每次打包要下载 Electron
# 并在三个平台上跑，没必要每次提交都烧 CI 额度。需要出包时到
# Actions → Build & Release → Run workflow 点一下。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 package.json 里的值）。填写会同时写回 package.json'
        required: false
        type: string
      platforms:
        description: '要构建的平台'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
      release:
        description: 'Create a GitHub Release after the build'
        required: true
        default: true
        type: boolean
      draft:
        description: 'Keep the release as a draft (needs a manual Publish click)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

# 允许创建 release 和上传附件
permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 先算出版本号和构建矩阵，供后面所有 job 复用 ─────────────────────
  # 单独一个 job 而不是各 job 各算一次：避免三个平台算出不一致的版本，
  # 也让 tag 名只有一个来源。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: 解析版本号
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          # 去掉可能手输的前导 v，统一由下面加
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION / tag: v$VERSION"

      - id: m
        name: 生成构建矩阵
        # 必须在这里动态生成，不能在 build job 上用
        # `if: inputs.platforms == matrix.name` 过滤 ——
        # job 级 if 拿不到 matrix 上下文（actionlint 会报
        # "context matrix is not allowed here"），那样写平台选择会静默失效，
        # 不管选什么都构建全部三个平台。
        run: |
          set -euo pipefail
          MAC='{"os":"macos-14","name":"macos","script":"build:mac"}'
          WIN='{"os":"windows-latest","name":"windows","script":"build:win"}'

          case "${{ inputs.platforms }}" in
            macos)   INCLUDE="[$MAC]" ;;
            windows) INCLUDE="[$WIN]" ;;
            *)       INCLUDE="[$MAC,$WIN]" ;;
          esac

          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "构建平台: ${{ inputs.platforms }}"
          echo "$INCLUDE"

  build:
    needs: prepare
    strategy:
      # 一个平台失败不影响其他平台继续，便于只重跑坏的那个
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        # agent-browser 的 postinstall 会下载 Chrome for Testing（~684MB），
        # 本项目只用 --cdp 连自己的 Chromium，完全不需要它。
        # pnpm-workspace.yaml 里已把它的 build 关掉，这里不必额外处理。
        run: pnpm install --frozen-lockfile

      - name: 写入版本号
        if: ${{ inputs.version != '' }}
        run: pnpm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: 生成应用图标
        # 图标产物（build/icon.*、resources/icon.png）已在仓库里，
        # 这一步是为了保证它们与 design/logo/icon.svg 始终同步 ——
        # 万一有人只改了 SVG 忘了重新生成，CI 会用最新的。
        run: pnpm icons

      - name: 校验代码
        run: |
          pnpm lint
          pnpm typecheck

      - name: 构建并打包
        run: pnpm run ${{ matrix.script }}
        env:
          # 不让 electron-builder 自己发布 —— 由后面的 release job 统一上传，
          # 否则三个平台会并发创建同一个 release 而互相覆盖。
          # 留空 GH_TOKEN 即可让它跳过 publish。
          GH_TOKEN: ''
          # 没配证书时别让 electron-builder 去钥匙串乱挑
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # ⚠️ 不要在这里写 CSC_LINK / CSC_KEY_PASSWORD。
          #
          # secret 未配置时 ${{ secrets.X }} 会展开成空字符串，而
          # electron-builder 判断的是「变量是否存在」而非「是否为空」——
          # 拿到空的 CSC_LINK 它会把空路径解析成项目根目录，
          # 然后报 `⨯ <projectRoot> not a file` 直接失败。
          # 本地能打包成功只是因为环境里根本没有这个变量。
          #
          # 要正式签名/公证时，在这里加回 CSC_LINK / CSC_KEY_PASSWORD，
          # 并把 electron-builder.yml 的 notarize 改成 true。
          # 加回时务必确认对应 secret 已配置，否则会重现上面的失败。

      - name: 整理待发布产物
        # dist/ 里还有 latest*.yml、blockmap、解包目录等，
        # 只挑真正给用户下载的安装包。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # -maxdepth 1：不进 mac-arm64/ 之类的解包目录
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -exec cp {} upload/ \;
          echo "--- 待上传 ---"
          ls -lh upload/ || true
          # 一个产物都没有说明打包实际失败了，别让它静默通过
          if [ -z "$(ls -A upload/ 2>/dev/null)" ]; then
            echo "::error::没有生成任何安装包产物"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: upload/
          retention-days: 14
          if-no-files-found: error

  # ── 汇总所有平台产物，创建 Release ─────────────────────────────────
  release:
    needs: [prepare, build]
    # build 里任一平台失败时仍然发布已成功的那些，
    # 但 build 被整体跳过时就不发。
    if: ${{ inputs.release && always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          set -euo pipefail
          mkdir -p release
          # download-artifact 会按 artifact 名建子目录，这里拍平
          find artifacts -type f -exec cp {} release/ \;
          echo "--- 本次发布 ---"
          ls -lh release/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          NOTES=$(cat <<'EOF'
          ## Install

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | `.dmg` or `.zip` |
          | Windows | `-setup.exe` |

          ### Opening it on macOS for the first time

          These builds are **adhoc-signed** — no Apple Developer certificate, no
          notarization — so Gatekeeper will block the first launch. To get past it:

          Right-click the app → Open → confirm "Open" in the dialog.

          Or drop the quarantine attribute from a terminal:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Personae.app
          ```

          ### Connecting Codex / Claude Code

          Launch the app and click "Configure Codex" on the main screen to write the
          config for you, or set it up by hand following the README. agent-browser is
          bundled — **you do not need to install Node or agent-browser separately**.

          The interface is in English by default; use the EN / 中 toggle in the
          top-right corner to switch to Chinese.
          EOF
          )

          # 默认直接发布而不是留草稿。草稿有个不明显的坑：GitHub 在草稿状态下
          # 根本不创建 tag（release 页 URL 会是 untagged-xxx 前缀，git ls-remote
          # 也看不到），必须等到 Publish 那一刻 tag 才落地。之前两次发版都因此
          # 需要手动补一次点击。要走人工复核就显式传 draft=true。
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          else
            FLAGS+=(--latest)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # tag 已存在就往已有 release 上追加文件，避免重跑直接失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，追加产物（--clobber 覆盖同名文件）"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$VERSION" \
              --notes "$NOTES" \
              "${FLAGS[@]}"
          fi

          echo "✓ 已创建草稿 release：$TAG"
          echo "到 Releases 页面确认内容后手动点 Publish。"

  # ── 发布 npm launcher 并登记官方 MCP Registry ─────────────────────
  # Registry 只托管元数据，必须先把可安装的 stdio launcher 发到 npm。
  # NPM_TOKEN 由仓库管理员设置；Registry 身份验证使用 GitHub OIDC，不需要
  # 额外的 MCP token。
  publish-mcp:
    needs: [prepare, build, release]
    if: ${{ inputs.release && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 同步 registry metadata 与 npm launcher
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version
          pnpm mcp:sync
          pnpm mcp:check

      - name: 发布 npm launcher（未发布版本）
        working-directory: packages/personae-mcp
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "npm version already exists; skipping npm publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages 是 npm 官方源之外的公开镜像；官方 MCP Registry
      # 仍只引用 registry.npmjs.org 的包，用户现有 npx 安装命令不变。
      - name: 镜像 npm launcher 到 GitHub Packages
        working-directory: packages/personae-mcp
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 将 GitHub Package 设为公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "/user/packages/npm/%40leek-emperor%2Fpersonae-mcp" -f visibility=public

      - name: 安装 mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: 通过 GitHub OIDC 登录 MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: 发布 MCP Registry metadata
        run: ./mcp-publisher publish
